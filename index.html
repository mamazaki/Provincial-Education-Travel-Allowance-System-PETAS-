<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบคำนวณเบี้ยเลี้ยงไปราชการ - PMSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @media print {
      .no-print { display: none; }
      .card { border: none !important; shadow: none !important; }
    }
    .footer-credit { font-size: 0.85rem; color: #6c757d; }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="text-center mb-4">
    <img src="https://udonpeo.go.th/img/Logo-300x300.png" alt="Logo" style="width:120px; height:120px; object-fit:contain; border-radius:12px; background:#fff;">
  </div>
  <h2 class="mb-4 text-center">ระบบคำนวณเบี้ยเลี้ยงไปราชการ</h2>

  <div class="card p-4 shadow-sm no-print">
    <div class="mb-3">
      <label for="position" class="form-label">ตำแหน่ง:</label>
      <select class="form-select" id="position">
        <option value="270">ศึกษาธิการจังหวัด (270 บาท)</option>
        <option value="240">รองศึกษาธิการจังหวัด (240 บาท)</option>
        <option value="240">ศึกษานิเทศก์ (240 บาท)</option>
        <option value="240">38 ค. (2) (240 บาท)</option>
        <option value="240">อื่น ๆ (240 บาท)</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="start" class="form-label">วันเวลาออกเดินทาง:</label>
      <input type="datetime-local" class="form-control" id="start">
    </div>

    <div class="mb-3">
      <label for="end" class="form-label">วันเวลากลับถึง:</label>
      <input type="datetime-local" class="form-control" id="end">
    </div>

    <div class="mb-3">
      <label for="meals" class="form-label">จำนวนมื้ออาหารที่ผู้จัดงานเลี้ยง:</label>
      <input type="number" class="form-control" id="meals" min="0" value="0">
    </div>

    <button class="btn btn-primary w-100" onclick="calculate()">คำนวณ</button>
  </div>

  <div id="resultContainer" class="mt-4" style="display:none;">
    <div class="card p-4 shadow-sm mt-3" id="resultArea">
      <h5 class="mb-3 border-bottom pb-2">ผลการคำนวณเบี้ยเลี้ยง</h5>
      <div id="resultText" class="fs-5"></div>
      
      <div class="mt-4 pt-3 border-top footer-credit text-center">
        ออกแบบ และพัฒนาโดย นายสุทธิชัย ชมชื่น นักวิชาการคอมพิวเตอร์ชำนาญการ<br>
        กลุ่มนโยบายและแผน สำนักงานศึกษาธิการจังหวัดอุดรธานี
      </div>
    </div>

    <div class="d-flex gap-2 mt-3 no-print">
      <button class="btn btn-secondary" onclick="printPage()">🖨 พิมพ์</button>
      <!-- <button class="btn btn-success" onclick="exportPDF()">📄 PDF</button>
      <button class="btn btn-info text-white" onclick="exportImage()">🖼 ภาพ</button> -->
    </div>
  </div>
</div>

<script>
  function formatDateThai(date) {
    const monthNamesThai = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const day = date.getDate();
    const month = monthNamesThai[date.getMonth()];
    const year = date.getFullYear() + 543;
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    return `${day} ${month} ${year} เวลา ${hours}:${minutes} น.`;
  }

  function calculate() {
    const startInput = document.getElementById('start').value;
    const endInput = document.getElementById('end').value;
    const meals = parseInt(document.getElementById('meals').value) || 0;
    
    // ดึงค่าเบี้ยเลี้ยงตามตำแหน่งที่เลือก
    const allowancePerDay = parseInt(document.getElementById('position').value);

    const start = new Date(startInput);
    const end = new Date(endInput);

    if (!startInput || !endInput || end <= start) {
      alert("กรุณากรอกวันเวลาให้ถูกต้อง (วันเวลากลับต้องหลังวันเวลาออกเดินทาง)");
      return;
    }

    const msPerDay = 1000 * 60 * 60 * 24;
    const diffMs = end - start;

    const fullDays = Math.floor(diffMs / msPerDay);
    const remainderMs = diffMs % msPerDay;
    const remainderHours = remainderMs / (1000 * 60 * 60);
    
    // ตรรกะ: เดินทางเกิน 12 ชั่วโมงให้นับเป็น 1 วัน
    const totalDays = fullDays + (remainderHours >= 12 ? 1 : 0);

    // หักมื้ออาหาร (80 บาทต่อมื้อตามมาตรฐาน)
    const mealDeduct = 80;
    const totalAllowance = (totalDays * allowancePerDay) - (meals * mealDeduct);

    // ดึงชื่อตำแหน่งที่เลือก
    const posSelect = document.getElementById('position');
    const posName = posSelect.options[posSelect.selectedIndex].text.split(' (')[0];

    const resultText = `
      <div class="mb-2">ตำแหน่ง: <strong>${posName}</strong> (อัตราวันละ ${allowancePerDay} บาท)</div>
      <div>ออกเดินทาง: <strong>${formatDateThai(start)}</strong></div>
      <div>กลับถึง: <strong>${formatDateThai(end)}</strong></div>
      <div>สิทธิเบี้ยเลี้ยง: <strong>${totalDays} วัน</strong></div>
      <div>หักมื้ออาหาร: <strong>${meals} มื้อ</strong> (หักมื้อละ ${mealDeduct} บาท รวม ${meals * mealDeduct} บาท)</div>
      <div class="mt-3 text-primary"><strong>คงเหลือเบี้ยเลี้ยงสุทธิ: ${totalAllowance.toLocaleString()} บาท</strong></div>
    `;

    document.getElementById("resultText").innerHTML = resultText;
    document.getElementById("resultContainer").style.display = "block";
  }

  function printPage() {
    window.print();
  }

  function exportPDF() {
    const element = document.getElementById('resultArea');
    const opt = {
      margin: 0.5,
      filename: 'เบี้ยเลี้ยงราชการ.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().from(element).set(opt).save();
  }

  function exportImage() {
    const element = document.getElementById('resultArea');
    html2canvas(element).then(canvas => {
      const link = document.createElement('a');
      link.download = 'เบี้ยเลี้ยงราชการ.png';
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }

  window.onload = function() {
    const now = new Date();
    // ตั้งค่าเริ่มต้นเป็นวันนี้ เวลาปัจจุบัน (หรือปรับเป็น 08:30 ตามเวลาเริ่มงานก็ได้นะคะ)
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    
    const defaultValue = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
    document.getElementById("start").value = defaultValue;
    document.getElementById("end").value = defaultValue;
  };
</script>

</body>
</html>
